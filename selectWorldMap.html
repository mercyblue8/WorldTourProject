<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="대륙별로 살펴보는 World Tour 세계지도." />
  <title>World Tour | 세계지도</title>
  <link rel="stylesheet" href="./shared/css/tokens.css" />
  <link rel="stylesheet" href="./shared/css/base.css" />
  <link rel="stylesheet" href="./pages/world-map/css/page.css" />
  <link rel="stylesheet" href="./pages/world-map/css/continent.css" />
  <link rel="stylesheet" href="./pages/world-map/css/navigation.css" />
  <script src="./shared/data/continents.js" defer></script>
  <script src="./pages/world-map/data/continents.js" defer></script>
  <script src="./pages/world-map/js/navigation.js" defer></script>
  <script src="./pages/world-map/js/main.js" defer></script>
</head>

<body>
  <main class="world-map" aria-label="세계지도">
    <div class="world-map__frame">
      <img class="world-map__image" src="./shared/images/world-map-dark-en.png" width="1672" height="941"
        alt="다크 네이비 배경의 입체 세계지도. North America(북아메리카), South America(남아메리카), Europe(유럽), Africa(아프리카), Asia(아시아), Oceania(오세아니아), Antarctica(남극)가 서로 다른 색으로 구분되어 있습니다."
        fetchpriority="high" />
      <svg class="world-map__regions" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg"
        role="group" aria-label="대륙 탐색"></svg>
    </div>
  </main>
  <div class="continent-arrival" aria-hidden="true">
    <img src="./pages/continents/asia/assets/map.png" width="1672" height="941" alt="" decoding="async" />
  </div>
  <p class="navigation-status" role="status"></p>
</body>

</html>
