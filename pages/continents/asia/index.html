<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="국가별 경계와 영문 이름으로 살펴보는 아시아 지도." />
  <title>World Tour | Asia</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../../shared/css/base.css" />
  <link rel="stylesheet" href="../common/css/layout.css" />
  <link rel="stylesheet" href="../common/css/return-transition.css" />
  <link rel="stylesheet" href="../common/css/country.css" />
  <link rel="stylesheet" href="../common/css/country-search.css" />
  <link rel="stylesheet" href="../../countries/common/css/country-return.css" />
  <link rel="stylesheet" href="../common/css/country-navigation.css" />
  <link rel="stylesheet" href="./css/page.css" />
  <link rel="stylesheet" href="../../../shared/css/travel-availability.css" />
  <script src="../../../shared/data/travel-availability.js" defer></script>
  <script src="../../../shared/js/travel-availability.js" defer></script>
  <script src="./data/config.js" defer></script>
  <script src="./data/countries.js" defer></script>
  <script src="./data/destinations.js" defer></script>
  <script src="../common/js/country-navigation.js" defer></script>
  <script src="../common/js/selection.js" defer></script>
  <script src="../common/js/country-search.js" defer></script>
  <script src="../common/js/return-transition.js" defer></script>
  <script src="../../../shared/js/cursor.js" defer></script>
  <script src="./js/main.js" defer></script>
  <link rel="stylesheet" href="../../../shared/css/cursor.css" />
</head>
<body>
  <main class="continent-page" aria-label="아시아 지도">
    <div class="continent-page__frame">
      <img class="continent-page__map" src="./assets/map.png" width="1672" height="941"
        alt="네이비 배경에 아시아 국가들의 경계와 영문 이름을 표시한 지도" fetchpriority="high" />
      <svg class="country-regions" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg"
        role="group" aria-label="아시아 국가 선택"></svg>
    </div>
  </main>
  <form class="country-search" role="search" aria-label="지도에서 국가 찾기">
    <label class="country-search__label" for="country-search-input">여행하실 국가를 검색 해주세요</label>
    <input class="country-search__input" id="country-search-input" type="search"
      placeholder="국가명 입력 (한글 / English)" autocomplete="off" spellcheck="false"
      aria-controls="country-search-status" />
    <p class="country-search__status" id="country-search-status" role="status" aria-live="polite" hidden></p>
  </form>
  <div class="country-info" hidden>
    <span class="country-info__name"></span>
    <span class="country-info__state"></span>
  </div>
  <p class="country-announcement" role="status" aria-live="polite"></p>
  <a class="continent-page__back" href="../../../selectWorldMap.html">Return WorldMap</a>
  <div class="country-portal" aria-hidden="true" inert>
    <div class="country-portal__preview">
      <img class="country-portal__image" alt="" decoding="async" hidden />
      <div class="country-portal__content">
        <p class="country-portal__eyebrow"></p>
        <h2 class="country-portal__title"></h2>
        <p class="country-portal__name"></p>
      </div>
    </div>
    <span class="country-back">Return</span>
  </div>
  <div class="world-return" aria-hidden="true">
    <div class="world-return__frame">
      <img src="../../../shared/images/world-map-dark-en.png" width="1672" height="941" alt="" decoding="async" />
    </div>
  </div>
</body>
</html>
