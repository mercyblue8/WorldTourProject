<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="World Tour 일본 페이지" />
  <title>World Tour | Japan</title>
  <link rel="preload" as="image" href="./assets/images/JapanMainPage.png" fetchpriority="high" />
  <link rel="stylesheet" href="../../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../../shared/css/base.css" />
  <link rel="stylesheet" href="./css/hero.css" />
  <link rel="stylesheet" href="./css/intro.css" />
  <link rel="stylesheet" href="./css/page.css" />
  <link rel="stylesheet" href="./css/photo-reveal.css" />
  <link rel="stylesheet" href="../../countries/common/css/photo-navigation.css" />
  <script src="./data/config.js" defer></script>
  <script src="./js/intro.js" defer></script>
  <script src="./js/photo-reveal.js" defer></script>
  <script src="../../countries/common/js/photo-navigation.js" defer></script>
  <script src="./js/main.js" defer></script>
</head>
<body>
  <main>
    <section class="tokyo-hero" aria-label="일본 첫 화면">
      <img class="tokyo-hero__image" src="./assets/images/JapanMainPage.png" width="3840" height="2160"
        alt="벚꽃과 후지산, 가와구치호 풍경 위에 こんにちは와 Japan | 日本 문구가 표시된 일본 첫 화면" fetchpriority="high" decoding="sync" />
      <h1 class="japan-intro" aria-label="Japan | Tradition Meets Culture" hidden>Japan | Tradition Meets Culture</h1>
    </section>
    <section id="japan-photos" class="japan-photos" tabindex="0" aria-label="일본의 거리와 밤 풍경, 가로 스크롤로 사진 탐색">
      <figure class="japan-photos__item">
        <img src="./assets/images/tokyo-crossing.png" alt="높은 곳에서 바라본 스크램블 교차로와 거리" loading="lazy" />
        <figcaption class="japan-photos__name">시부야-스크램블 교차로</figcaption>
      </figure>
      <figure class="japan-photos__item">
        <img src="./assets/images/tokyo-nightlife.png" alt="화려한 조명 아래 사람들로 붐비는 클럽" loading="lazy" />
        <figcaption class="japan-photos__name">신주쿠-클럽 워프</figcaption>
      </figure>
      <figure class="japan-photos__item">
        <img src="./assets/images/chiba-disneyland.jpg" alt="노을 속 디즈니랜드 성과 방문객들" loading="lazy" />
        <figcaption class="japan-photos__name">치바현-디즈니랜드</figcaption>
      </figure>
      <figure class="japan-photos__item">
        <img src="./assets/images/shibuya-sky.jpg" alt="전망대에서 내려다본 도쿄의 푸른 야경" loading="lazy" />
        <figcaption class="japan-photos__name">시부야 - 시부야스카이</figcaption>
      </figure>
    </section>
    <div class="photo-navigation" role="group" aria-label="사진 이동" hidden>
      <button class="photo-navigation__button" data-direction="prev" type="button" aria-label="이전 사진" aria-controls="japan-photos"></button>
      <button class="photo-navigation__button" data-direction="next" type="button" aria-label="다음 사진" aria-controls="japan-photos"></button>
    </div>
  </main>
  <a class="country-back" href="../../continents/asia/index.html">← 아시아 지도</a>
</body>
</html>
