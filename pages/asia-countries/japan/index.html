<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="World Tour 일본 페이지" />
  <title>World Tour | Japan</title>
  <link rel="preload" as="image" href="./assets/images/JapanMainPage.png" fetchpriority="high" />
  <link rel="stylesheet" href="../../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../../shared/css/base.css" />
  <link rel="stylesheet" href="./css/hero.css" />
  <link rel="stylesheet" href="./css/intro.css" />
  <link rel="stylesheet" href="./css/page.css" />
  <link rel="stylesheet" href="./css/photo-reveal.css" />
  <link rel="stylesheet" href="../../countries/common/css/photo-card.css" />
  <link rel="stylesheet" href="../../countries/common/css/modal.css" />
  <link rel="stylesheet" href="../../countries/common/css/photo-navigation.css" />
  <link rel="stylesheet" href="../../countries/common/css/country-return.css" />
  <script src="./data/config.js" defer></script>
  <script src="./js/intro.js" defer></script>
  <script src="./js/photo-reveal.js" defer></script>
  <script src="../../countries/common/js/photo-navigation.js" defer></script>
  <script src="../../countries/common/js/country-return.js" defer></script>
  <script src="../../countries/common/js/modal.js" defer></script>
  <script src="../../../shared/js/cursor.js" defer></script>
  <script src="./js/main.js" defer></script>
  <link rel="stylesheet" href="../../../shared/css/cursor.css" />
</head>
<body>
  <main>
    <section class="tokyo-hero" aria-label="일본 첫 화면">
      <img class="tokyo-hero__image" src="./assets/images/JapanMainPage.png" width="3840" height="2160"
        alt="벚꽃과 후지산, 가와구치호 풍경 위에 こんにちは와 Japan | 日本 문구가 표시된 일본 첫 화면" fetchpriority="high" decoding="sync" />
      <h1 class="japan-intro" aria-label="Japan | Tradition Meets Culture" hidden>Japan | Tradition Meets Culture</h1>
    </section>
    <section id="japan-photos" class="japan-photos" tabindex="0" aria-label="일본의 거리와 밤 풍경, 가로 스크롤로 사진 탐색">
      <figure class="japan-photos__item country-photo-card">
        <button class="country-photo-card__trigger" type="button" data-country-modal="shibuya-modal"
          aria-haspopup="dialog" aria-controls="shibuya-modal" aria-label="시부야 스크램블 교차로 자세히 보기">
          <img src="./assets/images/tokyo-crossing.png" alt="높은 곳에서 바라본 스크램블 교차로와 거리" loading="lazy" />
        </button>
        <figcaption class="japan-photos__name">시부야-스크램블 교차로</figcaption>
      </figure>
      <figure class="japan-photos__item country-photo-card">
        <img src="./assets/images/tokyo-nightlife.png" alt="화려한 조명 아래 사람들로 붐비는 클럽" loading="lazy" />
        <figcaption class="japan-photos__name">신주쿠-클럽 워프</figcaption>
      </figure>
      <figure class="japan-photos__item country-photo-card">
        <img src="./assets/images/chiba-disneyland.jpg" alt="노을 속 디즈니랜드 성과 방문객들" loading="lazy" />
        <figcaption class="japan-photos__name">치바현-디즈니랜드</figcaption>
      </figure>
      <figure class="japan-photos__item country-photo-card">
        <img src="./assets/images/shibuya-sky.jpg" alt="전망대에서 내려다본 도쿄의 푸른 야경" loading="lazy" />
        <figcaption class="japan-photos__name">시부야 - 시부야스카이</figcaption>
      </figure>
    </section>
    <div class="photo-navigation" role="group" aria-label="사진 이동" hidden>
      <button class="photo-navigation__button" data-direction="prev" type="button" aria-label="이전 사진" aria-controls="japan-photos"></button>
      <button class="photo-navigation__button" data-direction="next" type="button" aria-label="다음 사진" aria-controls="japan-photos"></button>
    </div>
  </main>
  <a class="country-back" href="../../continents/asia/index.html">Return</a>
  <dialog class="country-modal" id="shibuya-modal" aria-labelledby="shibuya-modal-title">
    <header class="country-modal__header">
      <p class="country-modal__context">Tokyo | 東京 - 밤이 더 환하게 빛나는 도시</p>
      <div class="country-modal__close-group">
        <kbd class="country-modal__shortcut" aria-hidden="true">ESC</kbd>
        <button class="country-modal__close" type="button" data-modal-close aria-label="모달 닫기" aria-keyshortcuts="Escape" autofocus>
          <span aria-hidden="true">×</span>
        </button>
      </div>
    </header>
    <div class="country-modal__content">
      <div class="country-modal__layout">
        <figure class="country-modal__visual">
          <img class="country-modal__image" src="./assets/images/tokyo-crossing.png"
            alt="높은 곳에서 바라본 시부야 스크램블 교차로와 주변 거리" loading="lazy" />
        </figure>
        <div class="country-modal__details">
          <p class="country-modal__eyebrow">TOKYO · SHIBUYA</p>
          <h2 class="country-modal__title" id="shibuya-modal-title">시부야 스크램블 교차로</h2>
          <p class="country-modal__lead">수많은 발걸음이 교차하는 순간,<br />도쿄의 일상이 하나의 풍경이 됩니다.</p>
          <section class="country-modal__section">
            <h3>장소 이야기</h3>
            <p>사람들의 움직임과 건물을 채운 간판이 어우러지는 시부야의 거리. 교차로를 중심으로 펼쳐지는 도시의 활기를 만나보세요.</p>
          </section>
          <section class="country-modal__section">
            <h3>사진 속 풍경</h3>
            <p>높은 시선에서 담은 횡단보도의 선과 사람들의 흐름. 가까이 걸을 때와는 다른 거리의 표정을 보여줍니다.</p>
          </section>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
