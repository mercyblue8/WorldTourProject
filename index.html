<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="세계를 여행하며 채워가는 개인 여행 포트폴리오." />
  <title>World Tour | 여행 포트폴리오</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232346d2'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='1.5'/%3E%3Cellipse cx='16' cy='16' rx='4' ry='10' fill='none' stroke='white' stroke-width='1.5'/%3E%3Cpath d='M6 16h20' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./shared/css/tokens.css" />
  <link rel="stylesheet" href="./shared/css/base.css" />
  <link rel="stylesheet" href="./pages/landing/css/page.css" />
  <link rel="stylesheet" href="./pages/landing/css/background-video.css" />
  <link rel="stylesheet" href="./pages/landing/css/transition.css" />
  <script src="./pages/landing/js/background-video.js" defer></script>
  <script src="./pages/landing/js/transition.js" defer></script>
  <script src="./shared/js/cursor.js" defer></script>
  <script src="./pages/landing/js/main.js" defer></script>
  <link rel="stylesheet" href="./shared/css/cursor.css" />
</head>

<body>
  <main class="dashboard">
    <div class="video-background" aria-hidden="true">
      <video class="background-video is-visible" muted playsinline preload="auto" tabindex="-1">
        <source src="./pages/landing/videos/background.mp4" type="video/mp4" />
      </video>
      <video class="background-video" muted playsinline preload="auto" tabindex="-1">
        <source src="./pages/landing/videos/background.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="hero-content">
      <h1 class="hero-title" aria-label="Feel your freedom"><span aria-hidden="true"><span
            style="--letter: 0">F</span><span style="--letter: 1">e</span><span style="--letter: 2">e</span><span
            style="--letter: 3">l</span> <span style="--letter: 5">y</span><span style="--letter: 6">o</span><span
            style="--letter: 7">u</span><span style="--letter: 8">r</span> <span style="--letter: 10">f</span><span
            style="--letter: 11">r</span><span style="--letter: 12">e</span><span style="--letter: 13">e</span><span
            style="--letter: 14">d</span><span style="--letter: 15">o</span><span style="--letter: 16">m</span></span>
      </h1>
      <button class="go-button" type="button">GO</button>
    </div>
  </main>
  <section class="loading-scene" aria-label="여행 로딩 영상" aria-hidden="true">
    <video class="loading-film" src="./pages/landing/videos/loading.mp4" muted playsinline preload="auto"></video>
    <button class="transition-back" type="button" tabindex="-1">처음으로 ↺</button>
  </section>
  <div class="map-arrival" aria-hidden="true">
    <img src="./shared/images/world-map-dark-en.png" width="1672" height="941" alt="" decoding="async" />
  </div>
  <p class="transition-status" role="status" hidden></p>
</body>

</html>
